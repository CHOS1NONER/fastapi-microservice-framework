[project]
name = "fastapi-microservice-framework"
version = "0.1.0"
description = "FastAPI + SQLAlchemy microservice framework"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.14",
    "uvicorn>=0.34.3",
    "pydantic-settings>=2.12.0",
    "loguru>=0.7.3",
    "pydantic>=2.11.7",
    "httpx>=0.28.1",
    "httpx2>=2.15.0",
    "fastapi-typed-client>=0.5.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "alembic>=1.16.0",
    "asyncmy>=0.2.10",
    "PyJWT>=2.10.1",
    "bcrypt>=4.2.1",
    "redis>=5.2.1",
    "celery[redis]>=5.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001", "S110", "G201", "TRY401"]

[tool.ruff.lint.per-file-ignores]
"clients/generated/*.py" = ["E501", "I001", "UP", "F821"]
"common/tasks/{pool,tracer}.py" = ["PLR0402", "PYI034", "RUF100", "PLE0704", "SIM102"]
